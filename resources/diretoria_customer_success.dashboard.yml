# Dashboard AI/BI "Diretoria de Customer Success". O layout fica em src/dashboards/diretoria_customer_success.lvdash.json.
# As consultas usam só o nome da tabela: catálogo e schema vêm daqui, para o mesmo
# dashboard funcionar em dev e prod.

resources:
  dashboards:
    diretoria_customer_success:
      display_name: "Diretoria de Customer Success"
      file_path: ../src/dashboards/diretoria_customer_success.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
