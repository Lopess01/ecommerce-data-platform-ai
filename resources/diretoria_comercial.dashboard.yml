# Dashboard AI/BI "Diretoria Comercial". O layout fica em src/dashboards/diretoria_comercial.lvdash.json.
# As consultas usam só o nome da tabela: catálogo e schema vêm daqui, para o mesmo
# dashboard funcionar em dev e prod.

resources:
  dashboards:
    diretoria_comercial:
      display_name: "Diretoria Comercial"
      file_path: ../src/dashboards/diretoria_comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
